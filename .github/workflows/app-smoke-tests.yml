# The Angular app's browser smoke tests (CookFeed_frontend/app/e2e): Playwright drives the real app in Chromium
# against the real API and a seeded PostgreSQL.
#
# They take minutes, so they run once per pull request: when it is opened. Pushing more commits to an open pull
# request does not run them again; the quick checks in app-tests.yml and api-tests.yml cover each push. To run them
# again on a branch (after a fix, say), start this workflow by hand: Actions > App smoke tests > Run workflow.
name: App smoke tests

on:
  pull_request:
    types: [opened]
    paths:
      - "CookFeed_frontend/app/**"
      - "CookFeed_api/**"
      - ".github/workflows/app-smoke-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: CookFeed_frontend/app

jobs:
  smoke:
    runs-on: ubuntu-24.04
    # About five minutes when all is well; the limit stops a stalled step from running for hours.
    timeout-minutes: 20

    services:
      # The same PostgreSQL as docker-compose.yml. No password: this server lives only for the run and is reachable
      # only from it, so it trusts local connections, as in api-tests.yml.
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The SDK version comes from global.json, the same pin every machine uses.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: CookFeed_api/global.json

      # The Node line the app is developed on; Angular 22 needs 22.22.3 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: CookFeed_frontend/app/package-lock.json

      # Builds the API and creates the cookfeed database from the migrations. The API fills it with the seed data
      # the first time it starts in Development, which is how Playwright starts it (playwright.config.ts).
      - name: Build the API and create the database
        working-directory: CookFeed_api
        run: |
          dotnet tool restore
          dotnet build Cookfeed.slnx
          dotnet ef database update --no-build --project src/Cookfeed.Infrastructure --startup-project src/Cookfeed.Api

      # The exact versions in package-lock.json, then the Chromium build that this Playwright version expects.
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts the API and the app's development server itself, waits for both, and stops them after.
      - name: Smoke tests
        run: npm run test:smoke

      # The HTML report, with a trace of each failed test, is kept only when something failed.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-playwright-report
          path: CookFeed_frontend/app/playwright-report/
          retention-days: 14
