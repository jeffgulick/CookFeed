# Checks the Angular app (CookFeed_frontend/app) on each pull request and each push to main that touches it: the
# unit tests (Vitest, through `ng test`), and a production build, which also type-checks every template.
name: App tests

on:
  pull_request:
    paths:
      - "CookFeed_frontend/app/**"
      - ".github/workflows/app-tests.yml"
  push:
    branches: [main]
    paths:
      - "CookFeed_frontend/app/**"
      - ".github/workflows/app-tests.yml"

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CookFeed_frontend/app

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Node line the app is developed on; Angular 22 needs 22.22.3 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: CookFeed_frontend/app/package-lock.json

      # The exact versions in package-lock.json.
      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:ci

      # Strict TypeScript and strict templates: a type error anywhere fails the build.
      - name: Build
        run: npm run build
