# Runs the prototype's unit tests (CookFeed_frontend/tests: its data and rules, on Node's built-in runner) on each
# pull request and each push to main that touches the prototype.
#
# The prototype's browser smoke tests (tests/smoke) no longer run here. The prototype is finished and is being
# converted to the Angular app, page by page; browser tests now run against the Angular pages as each is built.
# The smoke tests stay in the repository as the checklist those pages are converted against, and still run by hand
# with `npm run test:smoke`.
name: Prototype tests

on:
  pull_request:
    paths:
      - "CookFeed_frontend/prototype/**"
      - "CookFeed_frontend/tests/**"
      - "CookFeed_frontend/package.json"
      - ".github/workflows/prototype-tests.yml"
  push:
    branches: [main]
    paths:
      - "CookFeed_frontend/prototype/**"
      - "CookFeed_frontend/tests/**"
      - "CookFeed_frontend/package.json"
      - ".github/workflows/prototype-tests.yml"

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: prototype-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CookFeed_frontend

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm run test:unit
