<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Three Japanese weeknight dinners laid out on a kitchen counter">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1e3"/>
      <stop offset="1" stop-color="#f8e2cd"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" fill="url(#wall)"/>
  <circle cx="820" cy="82" r="46" fill="#fcd9b6" opacity=".7"/>
  <rect y="300" width="960" height="100" fill="#b9825a"/>
  <rect y="300" width="960" height="10" fill="#a06f4b"/>

  <!-- teriyaki bowl -->
  <g transform="translate(160 300)">
    <ellipse cx="0" cy="6" rx="112" ry="14" fill="#a06f4b" opacity=".45"/>
    <path d="M-104 -66 Q0 34 104 -66 Z" fill="#2f3b45"/>
    <path d="M-104 -66 Q0 -46 104 -66 Z" fill="#465764"/>
    <ellipse cx="0" cy="-66" rx="104" ry="20" fill="#f6f1e7"/>
    <ellipse cx="0" cy="-68" rx="86" ry="15" fill="#fffdf8"/>
    <g>
      <rect x="-56" y="-88" width="44" height="22" rx="8" fill="#8a4a20"/>
      <rect x="-8" y="-92" width="46" height="24" rx="8" fill="#a3561f"/>
      <rect x="18" y="-82" width="38" height="20" rx="8" fill="#8a4a20"/>
      <rect x="-34" y="-78" width="40" height="18" rx="7" fill="#b9682a"/>
    </g>
    <circle cx="-20" cy="-96" r="4" fill="#5f8f3a"/>
    <circle cx="6" cy="-100" r="4" fill="#77a94b"/>
    <circle cx="30" cy="-94" r="4" fill="#5f8f3a"/>
  </g>

  <!-- stir-fry pan -->
  <g transform="translate(480 300)">
    <ellipse cx="0" cy="6" rx="120" ry="14" fill="#a06f4b" opacity=".45"/>
    <rect x="96" y="-84" width="120" height="14" rx="7" fill="#3b3b40"/>
    <path d="M-112 -70 Q0 26 112 -70 Z" fill="#43434a"/>
    <ellipse cx="0" cy="-70" rx="112" ry="22" fill="#55555d"/>
    <ellipse cx="0" cy="-72" rx="96" ry="17" fill="#6a6a73"/>
    <g>
      <circle cx="-46" cy="-78" r="15" fill="#3f7a35"/>
      <circle cx="-56" cy="-88" r="10" fill="#4d9040"/>
      <circle cx="-36" cy="-90" r="9" fill="#4d9040"/>
      <rect x="-14" y="-92" width="30" height="16" rx="6" fill="#d4622a"/>
      <rect x="22" y="-86" width="28" height="15" rx="6" fill="#e0913a"/>
      <rect x="-4" y="-76" width="34" height="13" rx="6" fill="#c8531f"/>
      <circle cx="54" cy="-82" r="12" fill="#3f7a35"/>
      <rect x="-70" y="-72" width="26" height="11" rx="5" fill="#e8c07a"/>
    </g>
  </g>

  <!-- onigiri plate -->
  <g transform="translate(790 300)">
    <ellipse cx="0" cy="6" rx="108" ry="13" fill="#a06f4b" opacity=".45"/>
    <ellipse cx="0" cy="-16" rx="104" ry="24" fill="#e9e2d6"/>
    <ellipse cx="0" cy="-22" rx="92" ry="19" fill="#f7f3ea"/>
    <g>
      <path d="M-58 -34 L-30 -84 L-2 -34 Z" fill="#fffdf8" stroke="#e6ddcd" stroke-width="2"/>
      <rect x="-42" y="-50" width="24" height="16" fill="#2f3b45"/>
    </g>
    <g>
      <path d="M-14 -30 L14 -92 L42 -30 Z" fill="#fffdf8" stroke="#e6ddcd" stroke-width="2"/>
      <rect x="2" y="-50" width="24" height="20" fill="#2f3b45"/>
    </g>
    <g>
      <path d="M30 -34 L58 -80 L86 -34 Z" fill="#fffdf8" stroke="#e6ddcd" stroke-width="2"/>
      <rect x="46" y="-50" width="24" height="16" fill="#2f3b45"/>
    </g>
  </g>

  <!-- chopsticks -->
  <g transform="rotate(-8 300 250)">
    <rect x="252" y="252" width="150" height="6" rx="3" fill="#8a5a33"/>
    <rect x="252" y="264" width="150" height="6" rx="3" fill="#8a5a33"/>
  </g>
</svg>
